<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts - 中国省份边界</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .header {
      background: white;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 18px;
      color: #333;
    }
    .back-link {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      color: #333;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 60px);
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
    }
    .info-panel {
      position: fixed;
      right: 20px;
      top: 80px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 200px;
      font-size: 13px;
      z-index: 100;
    }
    .info-panel h3 {
      margin-bottom: 10px;
      font-size: 14px;
      color: #333;
    }
    .info-panel p {
      color: #666;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ECharts - 中国省份边界</h1>
    <a class="back-link" href="../index.html">返回</a>
  </div>
  <div id="chart"></div>
  <div class="loading" id="loading">正在加载地图数据...</div>
  <div class="info-panel" id="info-panel" style="display: none;">
    <h3>省份信息</h3>
    <p id="province-name">-</p>
    <p id="province-code">-</p>
  </div>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    // 加载省份边界数据
    fetch('../../products/china-provinces-gcj02.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';

        // 合并所有省份为一个GeoJSON
        const features = Object.values(data.provinces).map(province => {
          const feature = province.boundary.features[0];
          feature.properties = {
            name: province.name,
            adcode: province.adcode
          };
          return feature;
        });

        const mergedGeoJSON = {
          type: 'FeatureCollection',
          features: features
        };

        // 注册地图
        echarts.registerMap('china-provinces', mergedGeoJSON);

        // 省份名称列表
        const provinceNames = Object.values(data.provinces).map(p => p.name);

        // 配置选项
        const option = {
          title: {
            text: '中国省级行政区',
            subtext: '34个省份边界 - GCJ02坐标系',
            left: 'center',
            top: 20,
            textStyle: {
              fontSize: 20,
              color: '#333'
            },
            subtextStyle: {
              fontSize: 12,
              color: '#999'
            }
          },
          tooltip: {
            trigger: 'item',
            formatter: function(params) {
              if (params.data) {
                return params.name + '<br/>人口: ' + params.data.value + '万';
              }
              return params.name;
            }
          },
          visualMap: {
            min: 0,
            max: 10000,
            left: 'left',
            top: 'bottom',
            text: ['高', '低'],
            calculable: true,
            inRange: {
              color: ['#e8f4f8', '#a8d8ea', '#5fb3b3', '#3ba272']
            }
          },
          geo: {
            map: 'china-provinces',
            roam: true,
            zoom: 1.2,
            center: [104, 36],
            label: {
              show: false
            },
            itemStyle: {
              areaColor: '#e8f4f8',
              borderColor: '#3ba272',
              borderWidth: 1
            },
            emphasis: {
              itemStyle: {
                areaColor: '#c4e7d4',
                borderColor: '#3ba272',
                borderWidth: 2
              },
              label: {
                show: true,
                fontSize: 12,
                color: '#333'
              }
            }
          },
          series: [{
            type: 'map',
            map: 'china-provinces',
            geoIndex: 0,
            data: provinceNames.map(name => ({
              name: name,
              value: Math.floor(Math.random() * 9000 + 1000) // 模拟数据
            }))
          }]
        };

        chart.setOption(option);

        // 点击事件
        chart.on('click', function(params) {
          const panel = document.getElementById('info-panel');
          panel.style.display = 'block';
          document.getElementById('province-name').textContent = '名称: ' + params.name;

          // 查找adcode
          const province = Object.values(data.provinces).find(p => p.name === params.name);
          if (province) {
            document.getElementById('province-code').textContent = '编码: ' + province.adcode;
          }
        });
      })
      .catch(err => {
        document.getElementById('loading').textContent = '加载失败: ' + err.message;
        console.error(err);
      });

    // 响应窗口大小变化
    window.addEventListener('resize', () => {
      chart.resize();
    });
  </script>
</body>
</html>
