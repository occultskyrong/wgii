<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts - 国际国家边界</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .header {
      background: white;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 18px;
      color: #333;
    }
    .back-link {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      color: #333;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 60px);
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
    }
    .info-panel {
      position: fixed;
      right: 20px;
      top: 80px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 200px;
      font-size: 13px;
      z-index: 100;
    }
    .info-panel h3 {
      margin-bottom: 10px;
      font-size: 14px;
      color: #333;
    }
    .info-panel p {
      color: #666;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ECharts - 国际国家边界</h1>
    <a class="back-link" href="../index.html">返回</a>
  </div>
  <div id="chart"></div>
  <div class="loading" id="loading">正在加载地图数据...</div>
  <div class="info-panel" id="info-panel" style="display: none;">
    <h3>国家信息</h3>
    <p id="country-name">-</p>
    <p id="country-code">-</p>
    <p id="country-capital">-</p>
  </div>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    // 加载国际国家边界数据
    fetch('../../products/international-boundaries-wgs84.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';

        // 合并所有国家的边界为一个GeoJSON
        const features = [];
        const countryData = [];

        Object.values(data.continents).forEach(continent => {
          Object.values(continent.countries).forEach(country => {
            if (country.boundary && country.boundary.features) {
              country.boundary.features.forEach(feature => {
                feature.properties = {
                  name: country.name,
                  isoCode: country.isoCode,
                  capital: country.capital,
                  continent: continent.name
                };
                features.push(feature);
              });

              countryData.push({
                name: country.name,
                value: Math.floor(Math.random() * 900 + 100), // 模拟数据
                isoCode: country.isoCode,
                capital: country.capital
              });
            }
          });
        });

        const mergedGeoJSON = {
          type: 'FeatureCollection',
          features: features
        };

        // 注册地图
        echarts.registerMap('world', mergedGeoJSON);

        // 配置选项
        const option = {
          title: {
            text: '世界各国边界',
            subtext: '192个国家 - WGS84坐标系',
            left: 'center',
            top: 20,
            textStyle: {
              fontSize: 20,
              color: '#333'
            },
            subtextStyle: {
              fontSize: 12,
              color: '#999'
            }
          },
          tooltip: {
            trigger: 'item',
            formatter: function(params) {
              if (params.data) {
                return params.name + '<br/>' +
                       'ISO: ' + params.data.isoCode + '<br/>' +
                       '首都: ' + params.data.capital;
              }
              return params.name;
            }
          },
          visualMap: {
            min: 0,
            max: 1000,
            left: 'left',
            top: 'bottom',
            text: ['高', '低'],
            calculable: true,
            inRange: {
              color: ['#f0f0f0', '#a8d8ea', '#5fb3b3', '#3ba272']
            }
          },
          geo: {
            map: 'world',
            roam: true,
            zoom: 1,
            center: [0, 20],
            label: {
              show: false
            },
            itemStyle: {
              areaColor: '#f0f0f0',
              borderColor: '#ccc',
              borderWidth: 0.5
            },
            emphasis: {
              itemStyle: {
                areaColor: '#c4e7d4',
                borderColor: '#3ba272',
                borderWidth: 1
              },
              label: {
                show: true,
                fontSize: 10,
                color: '#333'
              }
            }
          },
          series: [{
            type: 'map',
            map: 'world',
            geoIndex: 0,
            data: countryData
          }]
        };

        chart.setOption(option);

        // 点击事件
        chart.on('click', function(params) {
          if (params.data) {
            const panel = document.getElementById('info-panel');
            panel.style.display = 'block';
            document.getElementById('country-name').textContent = '名称: ' + params.name;
            document.getElementById('country-code').textContent = 'ISO: ' + params.data.isoCode;
            document.getElementById('country-capital').textContent = '首都: ' + params.data.capital;
          }
        });
      })
      .catch(err => {
        document.getElementById('loading').textContent = '加载失败: ' + err.message;
        console.error(err);
      });

    // 响应窗口大小变化
    window.addEventListener('resize', () => {
      chart.resize();
    });
  </script>
</body>
</html>
