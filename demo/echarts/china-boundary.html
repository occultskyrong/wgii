<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts - 中国边境线</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .header {
      background: white;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 18px;
      color: #333;
    }
    .back-link {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      color: #333;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 60px);
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ECharts - 中国边境线</h1>
    <a class="back-link" href="../index.html">返回</a>
  </div>
  <div id="chart"></div>
  <div class="loading" id="loading">正在加载地图数据...</div>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    // 加载中国边境线数据
    fetch('../../products/china-boundary-gcj02.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';

        // 注册地图
        echarts.registerMap('china', data.boundary);

        // 配置选项
        const option = {
          title: {
            text: '中华人民共和国',
            subtext: '国家边界 - GCJ02坐标系',
            left: 'center',
            top: 20,
            textStyle: {
              fontSize: 20,
              color: '#333'
            },
            subtextStyle: {
              fontSize: 12,
              color: '#999'
            }
          },
          geo: {
            map: 'china',
            roam: true,
            zoom: 1.2,
            center: [104, 36],
            label: {
              show: false
            },
            itemStyle: {
              areaColor: '#e8f4f8',
              borderColor: '#3ba272',
              borderWidth: 1.5
            },
            emphasis: {
              itemStyle: {
                areaColor: '#c4e7d4',
                borderColor: '#3ba272',
                borderWidth: 2
              },
              label: {
                show: true,
                color: '#333'
              }
            }
          },
          series: []
        };

        chart.setOption(option);
      })
      .catch(err => {
        document.getElementById('loading').textContent = '加载失败: ' + err.message;
        console.error(err);
      });

    // 响应窗口大小变化
    window.addEventListener('resize', () => {
      chart.resize();
    });
  </script>
</body>
</html>
